{% extends "base.html" %}
{% block content %}
<section class="hero compact">
  <h1>Agenda</h1>
  <form class="search" method="get">
    <input name="q" value="{{ termo }}" placeholder="Descrição, pessoa ou tipo">
    <button>Buscar</button>
  </form>
</section>

<section class="panel">
  {% for h in rows %}
    <div class="history-card">
      <strong>{{ h.tipo }}</strong>
      <small>{{ h.data }} {{ h.hora }} · {{ h.pessoa_nome }} · {{ h.usuario_nome }}</small>
      <p>{{ h.descricao }}</p>
      {% if h.valor %}<span>{{ h.valor|dinheiro }}</span>{% endif %}
    </div>
  {% else %}
    <p class="empty">Nenhum histórico encontrado.</p>
  {% endfor %}
</section>
{% endblock %}
