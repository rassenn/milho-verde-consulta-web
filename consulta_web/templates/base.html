<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Milho Verde Sao Jose - Consulta" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo-milho-verde-sao-jose.png') }}" alt="">
      <span>Milho Verde Sao Jose</span>
    </a>
    <nav>
      <a href="{{ url_for('vendas') }}">Vendas</a>
      <a href="{{ url_for('clientes') }}">Clientes</a>
      <a href="{{ url_for('produtores') }}">Produtores</a>
      <a href="{{ url_for('holerits') }}">Holerits</a>
      <a href="{{ url_for('sair') }}">Sair</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
